<title>VoyageVista Werkplek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: data-dense backoffice — vaste zijbalk (240px) + sticky topbalk (56px) met globale zoek; werkvlak met KPI-rij, sorteerbare tabellen en detailpanelen. Onder 900px wordt de zijbalk een uitschuifmenu. */
:root {
  --bg: #f3f6f9;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --ink: #0b2536;
  --muted: #51667a;
  --line: #dbe4ec;
  --primary: #0369a1;
  --primary-ink: #ffffff;
  --primary-soft: #e0f2fe;
  --brand: #ea580c;
  --side: #0b2536;
  --side-ink: #b9cbd9;
  --side-hover: #12344b;
  --side-active: #174867;
  --ok: #15803d;  --ok-soft: #dcfce7;
  --warn: #a16207; --warn-soft: #fef3c7;
  --crit: #b91c1c; --crit-soft: #fee2e2;
  --backdrop: rgba(6, 20, 30, .55);
  --shadow-sm: 0 1px 2px rgba(11, 37, 54, .06);
  --shadow: 0 1px 2px rgba(11, 37, 54, .05), 0 6px 20px rgba(11, 37, 54, .06);
  --f-body: "Fira Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Fira Code", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 8px;
  --side-w: 240px;
  --top-h: 56px;
  --t-fast: 150ms;
  --t-med: 220ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1620; --surface: #102130; --surface-2: #14293a; --ink: #e3edf5; --muted: #95a9bb; --line: #213748;
    --primary: #38bdf8; --primary-ink: #04202f; --primary-soft: #0c3550; --brand: #fb923c;
    --side: #07111a; --side-ink: #a6bacb; --side-hover: #0f2433; --side-active: #0c3550;
    --ok: #4ade80; --ok-soft: #0f2e1c; --warn: #facc15; --warn-soft: #33290b; --crit: #f87171; --crit-soft: #3b1414;
    --backdrop: rgba(0, 0, 0, .6);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1620; --surface: #102130; --surface-2: #14293a; --ink: #e3edf5; --muted: #95a9bb; --line: #213748;
  --primary: #38bdf8; --primary-ink: #04202f; --primary-soft: #0c3550; --brand: #fb923c;
  --side: #07111a; --side-ink: #a6bacb; --side-hover: #0f2433; --side-active: #0c3550;
  --ok: #4ade80; --ok-soft: #0f2e1c; --warn: #facc15; --warn-soft: #33290b; --crit: #f87171; --crit-soft: #3b1414;
  --backdrop: rgba(0, 0, 0, .6);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { scroll-padding-top: calc(var(--top-h) + 16px); }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
h1:focus { outline: none; }
h2 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .8em; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
.ico { width: 18px; height: 18px; flex: none; }
.ico-sm { width: 15px; height: 15px; flex: none; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 100; background: var(--primary); color: var(--primary-ink); padding: 8px 12px; border-radius: 6px; font-weight: 600; text-decoration: none; }
.skip:focus { top: 8px; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 30; }
.brand { height: var(--top-h); display: flex; align-items: center; gap: 10px; padding: 0 18px; color: #fff; border-bottom: 1px solid rgba(255,255,255,.07); flex: none; }
.brand b { font-weight: 700; font-size: 1rem; letter-spacing: -.01em; display: block; line-height: 1.1; }
.brand small { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; }
.nav-label { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; opacity: .55; padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 6px; color: var(--side-ink); font-weight: 500; text-decoration: none; transition: background var(--t-fast), color var(--t-fast); }
.nav a:hover { background: var(--side-hover); color: #fff; }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--brand); }
.nav a span:first-of-type { flex: 1; }
.nav .count { font-size: .72rem; min-width: 22px; text-align: center; background: rgba(255,255,255,.1); padding: 1px 7px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.nav .count.alert { background: var(--brand); color: #fff; }
.side-foot { margin-top: auto; padding: 14px 18px 18px; border-top: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 6px; font-size: .78rem; }
.side-foot button { all: unset; cursor: pointer; opacity: .75; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; min-height: 32px; display: inline-flex; align-items: center; }
.side-foot button:hover { opacity: 1; }
.side-foot button:focus-visible { outline: 2px solid var(--brand); }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--top-h); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.icon-btn.menu-btn { display: none; }
.gsearch { position: relative; flex: 1 1 auto; max-width: 520px; min-width: 0; }
.gsearch .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.gsearch input { width: 100%; height: 38px; padding: 0 44px 0 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.gsearch input:focus { outline: 2px solid var(--primary); outline-offset: -1px; background: var(--surface); }
.gsearch kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 .72rem var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: var(--surface); }
.gresults { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; max-height: 60vh; overflow-y: auto; }
.gresults h3 { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 8px 10px 4px; font-weight: 600; }
.gresults a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; color: inherit; text-decoration: none; min-height: 40px; }
.gresults a:hover, .gresults a:focus-visible, .gresults a.active { background: var(--primary-soft); outline: none; }
.gresults .sub { font-size: .8rem; color: var(--muted); }
.gresults .none { padding: 14px 10px; color: var(--muted); font-size: .88rem; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--muted); transition: color var(--t-fast), border-color var(--t-fast); position: relative; }
.icon-btn:hover { color: var(--ink); border-color: var(--primary); }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); border: 2px solid var(--surface); }
.userbox { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 0 4px 0 4px; height: 38px; background: var(--surface); }
.userbox select { border: 0; background: transparent; height: 36px; padding: 0 4px; max-width: 210px; font-size: .88rem; font-weight: 500; }
.userbox select:focus { outline: none; }
.userbox:focus-within { outline: 2px solid var(--primary); outline-offset: 1px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .72rem; font-weight: 700; color: #fff; flex: none; letter-spacing: .02em; }
.avatar.lg { width: 48px; height: 48px; font-size: 1rem; }

.main { min-width: 0; display: flex; flex-direction: column; }
.content { padding: 24px 24px 56px; display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; }
.proto-bar { display: flex; gap: 8px; align-items: center; font-size: .8rem; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 7px 12px; }

.head { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; }
.head-l { display: flex; gap: 14px; align-items: center; min-width: 0; }
.head p.lead { margin-top: 4px; color: var(--muted); max-width: 70ch; }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: .82rem; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--primary); text-decoration: none; font-weight: 500; }
.crumbs a:hover { text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; color: var(--muted); font-size: .88rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Buttons, pills ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); min-height: 38px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: .88rem; display: inline-flex; align-items: center; gap: 7px; transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast); text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); }
.btn.danger:hover { border-color: var(--crit); background: var(--crit-soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: .8rem; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); line-height: 1.5; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill.plain::before { display: none; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.pill.info { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--surface-2); gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 30px; padding: 0 12px; border-radius: 6px; font-size: .82rem; font-weight: 500; color: var(--muted); transition: background var(--t-fast), color var(--t-fast); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 600; }
.seg .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }

/* ---------- Panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); min-width: 0; }
.panel-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.panel-h .sub { font-size: .8rem; color: var(--muted); font-weight: 400; }
.panel-b { padding: 16px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-eq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: border-color var(--t-fast), box-shadow var(--t-fast); position: relative; }
.kpi:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.kpi .k { font-size: .78rem; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; letter-spacing: -.02em; grid-column: 1; }
.kpi .s { font-size: .78rem; color: var(--muted); grid-column: 1 / -1; }
.kpi .kico { grid-row: 1 / span 2; grid-column: 2; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.kpi.crit .kico { background: var(--crit-soft); color: var(--crit); }
.kpi.crit .v { color: var(--crit); }
.kpi.warn .kico { background: var(--warn-soft); color: var(--warn); }
.kpi.warn .v { color: var(--warn); }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 0 14px; height: 38px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
th button:hover { color: var(--ink); }
th button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 3px; }
th .arrow { opacity: .35; font-size: .8rem; }
th[aria-sort] .arrow { opacity: 1; color: var(--primary); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; transition: background var(--t-fast); }
tr.click:hover td { background: var(--primary-soft); }
tr.click:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
td.r, th.r { text-align: right; }
th.r button { flex-direction: row-reverse; }
.cell-main { font-weight: 600; }
.cell-sub { font-size: .78rem; color: var(--muted); margin-top: 1px; }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.empty { padding: 32px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .ico { width: 28px; height: 28px; opacity: .6; }
.empty b { color: var(--ink); font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.toolbar .search-in { position: relative; flex: 1 1 260px; min-width: 0; }
.toolbar .search-in .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.toolbar .search-in input { padding-left: 34px; }
.toolbar .count-note { font-size: .82rem; color: var(--muted); }

/* ---------- Forms ---------- */
input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 11px; min-height: 38px; width: 100%; transition: border-color var(--t-fast);
}
textarea { padding: 9px 11px; min-height: 92px; resize: vertical; line-height: 1.45; }
input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: .82rem; font-weight: 600; }
.req { color: var(--crit); }
.hint { font-size: .78rem; color: var(--muted); }
.err { font-size: .78rem; color: var(--crit); font-weight: 600; display: flex; gap: 5px; align-items: flex-start; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--crit); }
.check { display: flex; gap: 8px; align-items: center; font-size: .88rem; min-height: 32px; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.readonly { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 0 11px; min-height: 38px; display: flex; align-items: center; font-size: .88rem; color: var(--muted); }
.notice { border-radius: 8px; padding: 10px 12px; font-size: .86rem; display: flex; gap: 9px; align-items: flex-start; line-height: 1.45; }
.notice .ico { margin-top: 1px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.crit { background: var(--crit-soft); color: var(--crit); }
.notice.info { background: var(--primary-soft); color: var(--primary); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.err-sum { border: 1px solid var(--crit); background: var(--crit-soft); color: var(--crit); border-radius: 8px; padding: 10px 12px; font-size: .86rem; }
.err-sum:focus { outline: 2px solid var(--crit); outline-offset: 2px; }
.err-sum ul { margin: 6px 0 0; padding-left: 18px; }
.err-sum a { color: inherit; font-weight: 600; }

/* ---------- Dialog ---------- */
dialog { border: 0; padding: 0; border-radius: 12px; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 24px 64px rgba(0,0,0,.3); }
dialog::backdrop { background: var(--backdrop); }
dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.dlg-h { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.dlg-h h2 { font-size: 1.1rem; }
.dlg-h p { margin-top: 3px; color: var(--muted); font-size: .86rem; }
.dlg-b { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-f { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 12px 12px; }
@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: dlg-in var(--t-med) cubic-bezier(.2, .8, .2, 1); }
  @keyframes dlg-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
}

/* ---------- Klantdossier ---------- */
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 9px 16px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv-wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 14px 24px; }
.kv-wide > div { display: flex; flex-direction: column; gap: 2px; }
.kv-wide dt { font-size: .76rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.privacy { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.privacy span { display: flex; gap: 7px; align-items: center; }
.privacy .ico-sm { color: var(--ok); }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: relative; }
.timeline li:last-child { border-bottom: 0; }
.tl-ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.tl-ico.klacht { background: var(--crit-soft); color: var(--crit); }
.tl-ico.boeking { background: var(--ok-soft); color: var(--ok); }
.tl-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.tl-top b { font-weight: 600; }
.tl-meta { font-size: .78rem; color: var(--muted); }
.tl-body { margin-top: 5px; font-size: .9rem; overflow-wrap: anywhere; max-width: 75ch; }

/* ================= Tabellen (sorteerbaar) ================= */
function table({ id, cols, rows, rowAttr = () => '', empty, defaultSort }) {
  const st = ui.sort[id] || defaultSort || null;
  let data = rows.slice();
  if (st) {
    const col = cols.find(c => c.key === st.key);
    if (col && col.sort) data.sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x < y ? -1 : x > y ? 1 : 0) * (st.dir === 'asc' ? 1 : -1); });
  }
  if (!data.length) return empty;
  const head = cols.map(c => {
    const active = st && st.key === c.key;
    const ariaSort = active ? `aria-sort="${st.dir === 'asc' ? 'ascending' : 'descending'}"` : '';
    const inner = c.sort ? `<button type="button" data-sort="${id}:${c.key}">${esc(c.label)}<span class="arrow" aria-hidden="true">${active ? (st.dir === 'asc' ? '↑' : '↓') : '↕'}</span></button>` : esc(c.label);
    return `<th scope="col" class="${c.cls || ''}" ${ariaSort}>${inner}</th>`;
  }).join('');
  const body = data.map(r => `<tr ${rowAttr(r)}>${cols.map(c => `<td class="${c.cls || ''}">${c.cell(r)}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const emptyState = (ico, title, txt, action = '') => `<div class="empty">${icon(ico)}<b>${title}</b><span>${txt}</span>${action}</div>`;

function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return { name: 'dashboard', id: null };
  const i = h.indexOf('-');
  return i === -1 ? { name: h, id: null } : { name: h.slice(0, i), id: h.slice(i + 1) };
}
function go(name, id = null) {
  const h = id ? `${name}-${id}` : name;
  if (location.hash.slice(1) === h) { view = { name, id }; render(true); }
  else location.hash = h;
}

  q = q.trim().toLowerCase();
  if (!q) return S.klanten;
  const qd = q.replace(/\D/g, '');
  return S.klanten.filter(k => {
    if (q.includes('@')) return k.email && k.email.toLowerCase().includes(q);
    if (qd.length >= 6 && k.telefoon && k.telefoon.replace(/\D/g, '').includes(qd)) return true;
    return naam(k).toLowerCase().includes(q) || k.id.toLowerCase() === q;
  });

function tlItem(x) {
  if (x.type === 'contact') {
    const c = x.c;
    return `<li class="${c.vervolgOpen ? 'open-item' : ''}"><div class="tl-ico">${icon(kanaalIco(c.kanaal), 'ico-sm')}</div><div>
      <div class="tl-top"><b>${esc(c.kanaal)}</b>${pill(c.categorie, 'plain')}<span class="tl-meta">${fmtDT(c.datum)} · ${esc(userName(c.medewerker))}</span></div>
      <p class="tl-body">${esc(c.samenvatting)}</p>
      ${c.afspraak ? `<p class="tl-body"><span class="muted">Afspraak:</span> ${esc(c.afspraak)}</p>` : ''}
      ${c.vervolg ? `<div class="tl-follow">${c.vervolgOpen ? `${pill('Open actie', 'warn')}<span>${esc(c.vervolg)}</span><button type="button" class="btn sm" data-done="${c.id}">${icon('check', 'ico-sm')}Afronden</button>` : `${pill('Afgerond', 'ok')}<span class="muted">${esc(c.vervolg)}</span>`}</div>` : ''}
    </div></li>`;
  }
  if (x.type === 'klacht') {
    const c = x.c;
    return `<li><div class="tl-ico klacht">${icon('alert', 'ico-sm')}</div><div>
      <div class="tl-top"><b>Klacht</b>${pill(c.status, statusCls(c.status))}${pill('Urgentie ' + c.urgentie.toLowerCase(), urgCls(c.urgentie))}<span class="tl-meta">${fmtDT(c.datum)}</span></div>
      <p class="tl-body">${esc(c.categorie)}: ${esc(c.omschrijving)}</p>
      <div class="tl-follow"><a class="btn sm" href="#klacht-${c.id}">Klacht openen</a></div>
    </div></li>`;
  }
  const b = x.c;
  return `<li><div class="tl-ico boeking">${icon('plane', 'ico-sm')}</div><div>
    <div class="tl-top"><b>Boeking</b><span class="mono muted">${b.id}</span><span class="tl-meta">vertrek ${fmtDate(b.vertrek)}</span></div>
    <p class="tl-body">${esc(b.product)}${b.reissom ? ' · ' + eur(b.reissom) : ''}</p></div></li>`;
}

/* ================= Klachten ================= */
function vKlachten() {
  const filters = ['Open', 'Wacht op goedkeuring', 'Afgehandeld', 'Alle'];
  const match = (k, f) => f === 'Alle' || (f === 'Open' ? klachtOpen(k) : f === 'Afgehandeld' ? !klachtOpen(k) : k.status === f);
  const list = S.klachten.filter(k => match(k, ui.klStatus));
  return `
  <div class="head"><div><h1>Klachten</h1><p class="lead">Urgente klachten staan bovenaan. Een compensatievoorstel gaat pas naar de klant na goedkeuring door een tweede medewerker.</p></div></div>
  <section class="panel">
    <div class="toolbar"><div class="seg" role="group" aria-label="Filter op status">${filters.map(f => `<button type="button" data-klf="${f}" aria-pressed="${ui.klStatus === f}">${f}<span class="n">${S.klachten.filter(k => match(k, f)).length}</span></button>`).join('')}</div></div>
    ${table({ id: 'klachten', rows: list, rowAttr: c => rowLink('klacht-' + c.id), defaultSort: { key: 'urg', dir: 'asc' },
      cols: [
        { key: 'cat', label: 'Klacht', sort: c => c.categorie, cell: c => `<div class="cell-main">${esc(c.categorie)}</div><div class="cell-sub"><span class="mono">${c.id}</span> · ${fmtDT(c.datum)}</div>` },
        { key: 'klant', label: 'Klant', sort: c => naam(klant(c.klantId) || {}), cell: c => { const k = klant(c.klantId); return k ? `<div class="who">${avatar(naam(k), klantKleur(k.id))}<span>${esc(naam(k))}</span></div>` : ''; } },
        { key: 'urg', label: 'Urgentie', sort: c => URG_RANK[c.urgentie] * 1e10 - new Date(c.datum).getTime() / 1000, cell: c => pill(c.urgentie, urgCls(c.urgentie)) },
        { key: 'st', label: 'Status', sort: c => c.status, cell: c => pill(c.status, statusCls(c.status)) },
        { key: 'age', label: 'Open sinds', cls: 'r', sort: c => klachtOpen(c) ? hoursSince(c.datum) : -1, cell: c => klachtOpen(c) ? `<span class="num">${ageLabel(hoursSince(c.datum))}</span>` : '<span class="muted">—</span>' },
        { key: 'som', label: 'Reissom', cls: 'r', sort: c => (S.boekingen.find(b => b.id === c.boekingId) || {}).reissom || 0, cell: c => { const b = S.boekingen.find(x => x.id === c.boekingId); return `<span class="num">${b ? eur(b.reissom) : '—'}</span>`; } }
      ],
      empty: emptyState('check', 'Geen klachten', 'Er zijn geen klachten in deze selectie.') })}
  </section>`;
}

function vKlacht() {
  const c = S.klachten.find(x => x.id === view.id);
  if (!c) return notFound('Klacht', 'klachten');
  const k = klant(c.klantId);
  const b = S.boekingen.find(x => x.id === c.boekingId);
  const rl = RICHTLIJNEN.find(r => r.cat === c.categorie) || { pct: 0 };
  const pct = c.pct ?? rl.pct;
  const me = S.currentUser;
  const flow = ['Nieuw', 'In behandeling', 'Wacht op goedkeuring', 'Afgehandeld'];
  const alt = ['Geëscaleerd (After Travel)', 'Ongegrond'].includes(c.status);
  const idx = alt ? (c.status === 'Ongegrond' ? 3 : 1) : flow.indexOf(c.status);
  const bewerkbaar = ['Nieuw', 'In behandeling', 'Geëscaleerd (After Travel)'].includes(c.status);
  const magGoedkeuren = c.status === 'Wacht op goedkeuring' && c.voorgesteldDoor !== me;
  const steps = flow.map((s, i) => {
    const label = (alt && i === idx) ? c.status : s;
    const cls = i < idx ? 'done' : i === idx ? (alt ? 'now alt' : (c.status === 'Afgehandeld' ? 'done' : 'now')) : '';
    return `<li class="${cls}"><span class="n">${i < idx || c.status === 'Afgehandeld' && i === idx ? icon('check', 'ico-sm') : i + 1}</span>${esc(label)}</li>`;
  }).join('');
  return `
  <div class="head">
    <div>
      <nav class="crumbs" aria-label="Kruimelpad"><a href="#klachten">Klachten</a><span aria-hidden="true">/</span><span class="mono">${c.id}</span></nav>
      <h1>${esc(c.categorie)}</h1>
      <div class="meta">${k ? `<a href="#klant-${k.id}" style="color:var(--primary);font-weight:600;text-decoration:none">${esc(naam(k))}</a>` : ''}${pill(c.status, statusCls(c.status))}${pill('Urgentie ' + c.urgentie.toLowerCase(), urgCls(c.urgentie))}${klachtOpen(c) ? `<span class="num">${icon('clock', 'ico-sm')} open sinds ${ageLabel(hoursSince(c.datum))}</span>` : ''}</div>
    </div>
    <div class="actions">
      ${klachtOpen(c) && c.status !== 'Geëscaleerd (After Travel)' ? `<button type="button" class="btn" data-act="escaleer">${icon('escalate', 'ico-sm')}Escaleren naar After Travel</button>` : ''}
    </div>
  </div>
  <ol class="stepper" aria-label="Voortgang klacht">${steps}</ol>
  <div class="grid-2">
    <div class="stack">
      <section class="panel" aria-labelledby="h-comp">
        <div class="panel-h"><h2 id="h-comp">Compensatie volgens richtlijn</h2><span class="sub">${esc(c.categorie)}</span></div>
        <div class="panel-b" style="display:flex;flex-direction:column;gap:14px">
          <div class="calc">
            <div><small>Reissom</small><strong>${eur(b?.reissom)}</strong></div>
            <div><small>Richtlijn</small><strong>${rl.pct}%</strong></div>
            <div class="hl"><small>Compensatie</small><strong id="calcBedrag" aria-live="polite">${eur((b?.reissom || 0) * pct / 100)}</strong></div>
          </div>
          ${bewerkbaar ? `
          <form id="compForm" class="form" novalidate>
            <div class="field" id="wrap-f-pct"><label for="f-pct">Toegekend percentage</label><input type="number" id="f-pct" min="0" max="100" step="0.5" value="${pct}" aria-describedby="f-pct-h"><span class="hint" id="f-pct-h">Richtlijn voor deze categorie: ${rl.pct}%</span></div>
            <div class="field full" id="wrap-f-toel"><label for="f-toel">Toelichting bij afwijking <span class="req" id="toelReq" ${pct === rl.pct ? 'hidden' : ''}>*</span></label><textarea id="f-toel" placeholder="Waarom wijkt het voorstel af van de richtlijn?">${esc(c.toelichting)}</textarea></div>
            <div class="field full" style="flex-direction:row;gap:8px;flex-wrap:wrap">
              <button type="submit" class="btn primary">${icon('shield', 'ico-sm')}Ter goedkeuring indienen</button>
              <button type="button" class="btn" data-act="ongegrond">Ongegrond verklaren</button>
            </div>
          </form>` : c.status === 'Wacht op goedkeuring' ? `
            <div class="notice ${magGoedkeuren ? 'info' : 'warn'}">${icon('shield', 'ico-sm')}<span>Voorstel van <b>${esc(userName(c.voorgesteldDoor))}</b>: ${c.pct}% = <b>${eur((b?.reissom || 0) * c.pct / 100)}</b>.${c.toelichting ? ` Toelichting: ${esc(c.toelichting)}` : ''}<br>${magGoedkeuren ? 'Controleer het voorstel. Na goedkeuring mag het naar de klant.' : 'Je hebt dit voorstel zelf ingediend. Een collega moet het goedkeuren (vier-ogenprincipe). Wissel rechtsboven van gebruiker om dit te testen.'}</span></div>
            <div class="actions"><button type="button" class="btn primary" data-act="goedkeuren" ${magGoedkeuren ? '' : 'disabled'}>${icon('check', 'ico-sm')}Goedkeuren en afhandelen</button><button type="button" class="btn" data-act="afkeuren" ${magGoedkeuren ? '' : 'disabled'}>Terugsturen</button></div>`
          : `<div class="notice ${c.status === 'Afgehandeld' ? 'ok' : 'info'}">${icon(c.status === 'Afgehandeld' ? 'check' : 'info', 'ico-sm')}<span>${c.status === 'Afgehandeld' ? `Afgehandeld met ${c.pct}% = <b>${eur((b?.reissom || 0) * c.pct / 100)}</b>. Goedgekeurd door ${esc(userName(c.goedgekeurdDoor))}.` : `Klacht ongegrond verklaard. ${esc(c.toelichting)}`}</span></div>`}
        </div>
      </section>
      <section class="panel" aria-labelledby="h-log">
        <div class="panel-h"><h2 id="h-log">Logboek</h2></div>
        ${c.log.length ? `<ol class="timeline">${c.log.slice().reverse().map(l => `<li><div class="tl-ico">${icon('clock', 'ico-sm')}</div><div><div class="tl-meta">${fmtDT(l.t)} · ${esc(userName(l.m))}</div><p class="tl-body">${esc(l.txt)}</p></div></li>`).join('')}</ol>` : emptyState('clock', 'Nog geen acties', 'Acties op deze klacht verschijnen hier.')}
      </section>
    </div>
    <section class="panel" aria-labelledby="h-det">
      <div class="panel-h"><h2 id="h-det">Details</h2></div>
      <div class="panel-b">
        <dl class="kv">
          <dt>Omschrijving</dt><dd>${esc(c.omschrijving)}</dd>
          <dt>Boeking</dt><dd>${b ? `${esc(b.product)}<br><span class="mono muted">${b.id}</span>` : '—'}</dd>
          <dt>Reisperiode</dt><dd>${b ? `${fmtDate(b.vertrek)} – ${fmtDate(b.terug)}` : '—'}</dd>
          <dt>Accommodatie</dt><dd>${b ? (b.zelfGekozen ? pill('Zelf gekozen door klant', 'warn') : pill('Op advies reisadviseur', 'info')) : '—'}</dd>
          <dt>Geregistreerd</dt><dd>${fmtDT(c.datum)} door ${esc(userName(c.geregistreerdDoor))}</dd>
        </dl>
        ${b && b.zelfGekozen ? `<div class="notice info" style="margin-top:14px">${icon('info', 'ico-sm')}<span>De klant koos deze accommodatie zelf. Neem dit mee in de beoordeling.</span></div>` : ''}
      </div>
    </section>
  </div>`;
}

/* ================= Leveranciers ================= */

  const q = ui.levQuery.trim().toLowerCase();
  const list = S.leveranciers.filter(l => {
    const o = laatsteOnd(l.id);
    return (!q || (l.naam + ' ' + l.plaats + ' ' + l.land + ' ' + l.type).toLowerCase().includes(q)) && (ui.levStatus === 'Alle' || (o ? o.status : '') === ui.levStatus);
  });
  return `
  <div class="head"><div><h1>Leveranciers</h1><p class="lead">Hotels, appartementen, vervoerders en rederijen, met de stand van de onderhandeling.</p></div>
    <div class="actions"><button type="button" class="btn primary" data-act="nieuweLev">${icon('plus', 'ico-sm')}Leverancier toevoegen</button></div></div>
  <section class="panel">
    <div class="toolbar">
      <div class="search-in">${icon('search', 'ico-sm')}<label for="levQuery" class="sr-only">Leverancier zoeken</label><input type="search" id="levQuery" placeholder="Zoek op naam, plaats, land of type" value="${esc(ui.levQuery)}"></div>
      <label for="levStatus" class="sr-only">Filter op status</label>
      <select id="levStatus" style="width:auto;min-width:190px">${['Alle', ...OND_STATUS].map(s => `<option value="${s}" ${ui.levStatus === s ? 'selected' : ''}>${s === 'Alle' ? 'Alle statussen' : s}</option>`).join('')}</select>
      <span class="count-note num" aria-live="polite">${list.length} leveranciers</span>

    ${table({ id: 'lev', rows: list, rowAttr: l => rowLink('leverancier-' + l.id), defaultSort: { key: 'naam', dir: 'asc' },
      cols: [
        { key: 'naam', label: 'Leverancier', sort: l => l.naam.toLowerCase(), cell: l => { const sig = S.contracten.filter(c => c.levId === l.id).flatMap(contractSignalen).filter(s => s.cls); return `<div class="cell-main">${esc(l.naam)}</div><div class="cell-sub mono">${l.id}</div>${sig.length ? `<div class="chips" style="margin-top:5px">${sig.map(s => pill(s.txt, s.cls)).join('')}</div>` : ''}`; } },

        { key: 'st', label: 'Onderhandeling', sort: l => { const o = laatsteOnd(l.id); return o ? OND_STATUS.indexOf(o.status) : 99; }, cell: l => { const o = laatsteOnd(l.id); return o ? pill(o.status, statusCls(o.status)) : '<span class="muted">—</span>'; } },
        { key: 'bez', label: 'Laatste bezoek', cls: 'r', sort: l => (laatsteOnd(l.id) || {}).datum || '', cell: l => { const o = laatsteOnd(l.id); return o ? `<span class="num">${fmtDate(o.datum)}</span>${daysUntil(o.datum) > 0 ? `<div class="cell-sub">gepland</div>` : ''}` : '—'; } }
      ],

      cols: [
        { key: 'datum', label: 'Bezoek', sort: o => o.datum, cell: o => `<div class="cell-main num">${fmtDate(o.datum)}</div><div class="cell-sub" style="max-width:48ch">${esc(o.notitie)}</div>${o.volumekorting ? `<div class="cell-sub"><b style="color:var(--ink);font-weight:600">Volume:</b> ${esc(o.volumekorting)}</div>` : ''}` },

/* ================= Dialogen ================= */
const dlg = document.getElementById('dlg');
let dlgSubmit = null, dlgReturn = null;
function openDialog(title, sub, body, submitLabel, onSubmit, opts = {}) {
  dlgReturn = document.activeElement;
  dlg.innerHTML = `<form method="dialog" novalidate>
    <div class="dlg-h"><div><h2 id="dlgTitle">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button type="button" class="icon-btn" data-close aria-label="Sluiten">${icon('x')}</button></div>
    <div class="dlg-b"><div class="err-sum" id="errSum" tabindex="-1" role="alert" hidden></div>${body}</div>
    <div class="dlg-f"><button type="button" class="btn" data-close>${submitLabel ? 'Annuleren' : 'Sluiten'}</button>${submitLabel ? `<button type="submit" class="btn ${opts.danger ? 'danger' : 'primary'}">${submitLabel}</button>` : ''}</div>
  </form>`;
  dlgSubmit = onSubmit;
  dlg.showModal();
  const first = dlg.querySelector('.dlg-b input:not([type=checkbox]), .dlg-b select, .dlg-b textarea') || dlg.querySelector('[data-close]');
  if (first) first.focus();
}
dlg.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === dlg) dlg.close(); });
dlg.addEventListener('close', () => { if (dlgReturn && document.contains(dlgReturn)) dlgReturn.focus(); else { const h = document.querySelector('#content h1'); if (h) h.focus({ preventScroll: true }); } });
dlg.addEventListener('submit', e => {
  e.preventDefault();
  if (!dlgSubmit) return;
  const res = dlgSubmit(dlg.querySelector('form'));
  if (res === false) showErrSummary(); else dlg.close();
});
function showErrSummary() {
  const sum = dlg.querySelector('#errSum');
  const inv = [...dlg.querySelectorAll('.field.invalid')];
  if (!inv.length) { sum.hidden = true; return; }
  sum.hidden = false;
  sum.innerHTML = `<b>${inv.length === 1 ? 'Er is 1 veld dat aandacht nodig heeft' : `Er zijn ${inv.length} velden die aandacht nodig hebben`}</b><ul>${inv.map(f => { const inp = f.querySelector('input, select, textarea'); const lbl = f.querySelector('label, .lbl'); return `<li><a href="#" data-focus="${inp ? inp.id : ''}">${esc(lbl ? lbl.textContent.replace('*', '').replace('(verplicht)', '').trim() : '')}</a>: ${esc(f.querySelector('.err')?.textContent || '')}</li>`; }).join('')}</ul>`;
  const firstInp = inv[0].querySelector('input, select, textarea');
  if (firstInp) firstInp.focus(); else sum.focus();
}
dlg.addEventListener('click', e => { const a = e.target.closest('[data-focus]'); if (a) { e.preventDefault(); const el = dlg.querySelector('#' + a.dataset.focus); if (el) el.focus(); } });

const fld = (id, label, input, { req, hint, full } = {}) => `<div class="field ${full ? 'full' : ''}" id="wrap-${id}"><label for="${id}">${label}${req ? ' <span class="req" aria-hidden="true">*</span><span class="sr-only">(verplicht)</span>' : ''}</label>${input}${hint ? `<span class="hint" id="${id}-hint">${hint}</span>` : ''}</div>`;
const sel = (id, opts, val, labels) => `<select id="${id}">${opts.map((o, i) => `<option value="${esc(o)}" ${o === val ? 'selected' : ''}>${esc(labels ? labels[i] : o)}</option>`).join('')}</select>`;
function setErr(id, msg, root = dlg) {
  const w = root.querySelector('#wrap-' + id);
  if (!w) return !msg;
  const inp = w.querySelector('input, select, textarea');
  w.classList.toggle('invalid', !!msg);
  let e = w.querySelector('.err');
  if (msg) {
    if (!e) { e = document.createElement('span'); e.className = 'err'; e.id = id + '-err'; w.appendChild(e); }
    e.innerHTML = icon('alert', 'ico-sm') + '<span>' + esc(msg) + '</span>';
    if (inp) { inp.setAttribute('aria-invalid', 'true'); inp.setAttribute('aria-describedby', [id + '-err', w.querySelector('.hint') ? id + '-hint' : ''].filter(Boolean).join(' ')); }
  } else {
    if (e) e.remove();
    if (inp) { inp.removeAttribute('aria-invalid'); if (w.querySelector('.hint')) inp.setAttribute('aria-describedby', id + '-hint'); else inp.removeAttribute('aria-describedby'); }
  }
  return !msg;
}
const val = id => (dlg.querySelector('#' + id)?.value ?? '').trim();
const emailOk = m => !m || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m);

    ok = setErr('k-em', !emailOk(em) ? 'Dit is geen geldig e-mailadres, bijv. naam@voorbeeld.nl' : (!vl && !em && !tel ? 'Vul een e-mailadres of telefoonnummer in, zodat we de klant kunnen bereiken.' : '')) && ok;

  });
  const upd = () => {
    const inP = +val('o-in') || 0, uit = +val('o-uit') || 0, box = dlg.querySelector('#o-marge');
    if (!inP || !uit) { box.className = 'notice info'; box.innerHTML = `${icon('info', 'ico-sm')}<span>Vul inkoop- en verkoopprijs in om de marge te berekenen.</span>`; return; }
    const m = uit - inP;
    box.className = 'notice ' + (m < 0 ? 'crit' : 'ok');
    box.innerHTML = m < 0 ? `${icon('alert', 'ico-sm')}<span><b>Negatieve marge: ${eur(m)} per nacht.</b> De verkoopprijs ligt onder de inkoopprijs.</span>` : `${icon('check', 'ico-sm')}<span>Marge: <b>${eur(m)}</b> per nacht (${Math.round(m / uit * 100)}% van de verkoopprijs).</span>`;
  };
  dlg.querySelector('#o-in').addEventListener('input', upd);
  dlg.querySelector('#o-uit').addEventListener('input', upd);
}

function dlgContract(l) {
  const dv = [{ dagen: 42, pct: 25 }, { dagen: 28, pct: 50 }, { dagen: 7, pct: 100 }];
  openDialog('Contract vastleggen', esc(l.naam), `
    <div class="form">
      ${fld('ct-b', 'Begindatum', `<input type="date" id="ct-b" value="${addDays(30)}">`, { req: true })}
      ${fld('ct-e', 'Einddatum', `<input type="date" id="ct-e" value="${addDays(210)}">`, { req: true })}
      ${fld('ct-type', 'Kamertype', sel('ct-type', KAMERTYPES, KAMERTYPES[0]), { req: true, full: true, hint: 'Vaste lijst, zodat verkoop en klant precies weten wat er geboekt wordt.' })}
      ${fld('ct-k', 'Aantal gecontracteerde kamers', '<input type="number" id="ct-k" min="1" step="1" value="20" inputmode="numeric">', { req: true })}
      ${fld('ct-p', 'Inkoopprijs per nacht (€)', '<input type="number" id="ct-p" min="0" step="1" value="55" inputmode="decimal">', { req: true })}
      <div class="field full" id="wrap-ct-v"><span class="lbl">Annuleringsvoorwaarden</span>
        <div class="voorw">${dv.map((v, i) => `<div class="voorw-row"><small>Regel ${i + 1}</small><input type="number" id="ct-vd${i}" min="0" value="${v.dagen}" aria-label="Regel ${i + 1}: dagen vóór vertrek"><input type="number" id="ct-vp${i}" min="0" max="100" value="${v.pct}" aria-label="Regel ${i + 1}: kosten in procent"></div>`).join('')}</div>
        <span class="hint" id="ct-v-hint">Per regel: vanaf X dagen vóór vertrek (links) geldt Y% annuleringskosten (rechts).</span></div>
    </div>`, 'Contract opslaan', () => {
    const b = val('ct-b'), e = val('ct-e'), k = +val('ct-k'), p = val('ct-p');
    const vw = [0, 1, 2].map(i => ({ dagen: +val('ct-vd' + i), pct: +val('ct-vp' + i) }));
    let ok = true;
    ok = setErr('ct-b', b ? '' : 'Kies een begindatum.') && ok;
    ok = setErr('ct-e', !e ? 'Kies een einddatum.' : (b && e < b ? 'De einddatum moet op of na de begindatum liggen.' : '')) && ok;
    ok = setErr('ct-k', k >= 1 && Number.isInteger(k) ? '' : 'Vul een heel aantal kamers in (minimaal 1).') && ok;
    ok = setErr('ct-p', p !== '' && +p >= 0 ? '' : 'Vul de inkoopprijs in.') && ok;
    ok = setErr('ct-v', vw.every(v => v.dagen >= 0 && v.pct >= 0 && v.pct <= 100) ? '' : 'Percentages liggen tussen 0 en 100, dagen zijn 0 of meer.') && ok;
    if (!ok) return false;
    S.contracten.push({ id: uid('CT'), levId: l.id, begin: b, einde: e, kamertype: val('ct-type'), kamers: k, verkocht: 0, prijs: +p, voorwaarden: vw.sort((x, y) => y.dagen - x.dagen) });
    save(); render(); toast('Contract opgeslagen');
  });
}

/* ================= Klachtacties ================= */
function klachtLog(c, txt) { c.log.push({ t: nowISO(), m: S.currentUser, txt }); }
function onCompSubmit(form) {
  const c = S.klachten.find(x => x.id === view.id);
  const rl = RICHTLIJNEN.find(r => r.cat === c.categorie) || { pct: 0 };
  const pct = parseFloat(form.querySelector('#f-pct').value);
  const toel = form.querySelector('#f-toel').value.trim();
  const okPct = setErr('f-pct', isNaN(pct) || pct < 0 || pct > 100 ? 'Vul een percentage tussen 0 en 100 in.' : '', form);
  const okToel = setErr('f-toel', okPct && pct !== rl.pct && toel.length < 5 ? `Je wijkt af van de richtlijn (${rl.pct}%). Geef een toelichting.` : '', form);
  if (!okPct || !okToel) { const f = form.querySelector('.field.invalid input, .field.invalid textarea'); if (f) f.focus(); return; }
  Object.assign(c, { pct, toelichting: toel, status: 'Wacht op goedkeuring', voorgesteldDoor: S.currentUser });
  klachtLog(c, `Compensatievoorstel ${pct}% ingediend${toel ? ': ' + toel : '.'}`);
  save(); render(); toast('Voorstel ingediend ter goedkeuring');
}

/* ================= Globale zoek ================= */
const gq = document.getElementById('gq'), gres = document.getElementById('gres');
function renderGlobal() {
  const q = gq.value.trim().toLowerCase();
  if (q.length < 2) { gres.hidden = true; gq.setAttribute('aria-expanded', 'false'); return; }
  const ks = zoekKlanten(q).slice(0, 5);
  const ls = S.leveranciers.filter(l => (l.naam + ' ' + l.plaats + ' ' + l.land).toLowerCase().includes(q)).slice(0, 4);
  const cs = S.klachten.filter(c => c.id.toLowerCase().includes(q) || c.categorie.toLowerCase().includes(q)).slice(0, 3);
  const grp = (t, arr, fn) => arr.length ? `<h3>${t}</h3>${arr.map(fn).join('')}` : '';
  gres.innerHTML = (ks.length + ls.length + cs.length) ? (
    grp('Klanten', ks, k => `<a href="#klant-${k.id}">${avatar(naam(k), klantKleur(k.id))}<span><span>${esc(naam(k))}</span><br><span class="sub">${esc(k.email || k.woonplaats || k.id)}</span></span></a>`) +
    grp('Leveranciers', ls, l => `<a href="#leverancier-${l.id}"><span class="kico" style="width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--primary-soft);color:var(--primary)">${icon('building', 'ico-sm')}</span><span><span>${esc(l.naam)}</span><br><span class="sub">${esc(l.plaats)}, ${esc(l.land)}</span></span></a>`) +
    grp('Klachten', cs, c => `<a href="#klacht-${c.id}"><span class="kico" style="width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--crit-soft);color:var(--crit)">${icon('alert', 'ico-sm')}</span><span><span>${esc(c.categorie)}</span><br><span class="sub mono">${c.id}</span></span></a>`)
  ) : `<div class="none">Niets gevonden voor “${esc(gq.value)}”.</div>`;
  gres.hidden = false; gq.setAttribute('aria-expanded', 'true');
}
gq.addEventListener('input', renderGlobal);
gq.addEventListener('focus', renderGlobal);
gq.addEventListener('keydown', e => {
  const links = [...gres.querySelectorAll('a')];
  if (e.key === 'Enter' && links[0]) { e.preventDefault(); location.hash = links[0].getAttribute('href'); closeGlobal(); }
  if (e.key === 'ArrowDown' && links[0]) { e.preventDefault(); links[0].focus(); }
  if (e.key === 'Escape') { closeGlobal(); gq.blur(); }
});
gres.addEventListener('keydown', e => {
  const links = [...gres.querySelectorAll('a')], i = links.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); (links[i + 1] || links[0]).focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); i <= 0 ? gq.focus() : links[i - 1].focus(); }
  if (e.key === 'Escape') { closeGlobal(); gq.focus(); }
});
gres.addEventListener('click', e => { if (e.target.closest('a')) closeGlobal(); });
function closeGlobal() { gres.hidden = true; gq.setAttribute('aria-expanded', 'false'); gq.value = ''; }
document.addEventListener('click', e => { if (!e.target.closest('.gsearch')) { gres.hidden = true; gq.setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.target.closest('input, textarea, select') && !dlg.open) { e.preventDefault(); gq.focus(); }
  if (e.key === 'Escape' && document.getElementById('app').classList.contains('nav-open')) closeNav();
});

/* ================= Thema & mobiel menu ================= */
const themeBtn = document.getElementById('themeBtn');
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function paintTheme() { const dk = isDark(); themeBtn.innerHTML = icon(dk ? 'sun' : 'moon'); themeBtn.setAttribute('aria-label', dk ? 'Lichte modus' : 'Donkere modus'); }
try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
themeBtn.addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem(THEME_KEY, t); } catch (e) {} paintTheme(); });
paintTheme();

const app = document.getElementById('app'), menuBtn = document.getElementById('menuBtn');
menuBtn.innerHTML = icon('menu');
function closeNav() { app.classList.remove('nav-open'); menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', () => { const open = app.classList.toggle('nav-open'); menuBtn.setAttribute('aria-expanded', String(open)); if (open) document.querySelector('#nav a')?.focus(); });
document.getElementById('navBackdrop').addEventListener('click', closeNav);

/* ================= Toast ================= */
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.innerHTML = icon('check') + '<span>' + esc(msg) + '</span>'; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }

/* ================= Events ================= */
document.addEventListener('click', e => {
  const kpi = e.target.closest('[data-klstatus]'); if (kpi) ui.klStatus = kpi.dataset.klstatus;
  const t = e.target.closest('button, tr.click');
  if (!t || dlg.contains(t)) return;
  const ds = t.dataset;
  if (ds.href) { location.hash = ds.href; return; }
  if (ds.sort) { const [id, key] = ds.sort.split(':'); const cur = ui.sort[id]; ui.sort[id] = { key, dir: cur && cur.key === key && cur.dir === 'asc' ? 'desc' : 'asc' }; render(); document.querySelector(`[data-sort="${ds.sort}"]`)?.focus(); return; }
  if (ds.tl) { ui.tlFilter = ds.tl; render(); document.querySelector(`[data-tl="${ds.tl}"]`)?.focus(); return; }
  if (ds.klf) { ui.klStatus = ds.klf; render(); document.querySelector(`[data-klf="${ds.klf}"]`)?.focus(); return; }
  if (ds.done) { const c = S.contacten.find(x => x.id === ds.done); c.vervolgOpen = false; save(); render(); toast('Vervolgactie afgerond'); return; }
  if (ds.verkoop) { const c = S.contracten.find(x => x.id === ds.verkoop); if (c.verkocht < c.kamers) c.verkocht++; save(); render(); document.querySelector(`[data-verkoop="${ds.verkoop}"]`)?.focus(); return; }
  const act = ds.act; if (!act) return;
  if (act === 'nieuweKlant') dlgKlantForm(null);
  if (act === 'bewerkKlant') dlgKlantForm(klant(view.id));
  if (act === 'contact') dlgContact(klant(view.id));
  if (act === 'klacht') dlgKlacht(klant(view.id));
  if (act === 'avg') dlgAvg(klant(view.id));
  if (act === 'nieuweLev') dlgLeverancier();
  if (act === 'nieuweOnd') dlgOnderhandeling(lev(view.id));
  if (act === 'nieuwContract') dlgContract(lev(view.id));
  const c = view.name === 'klacht' ? S.klachten.find(x => x.id === view.id) : null;
  if (c && act === 'escaleer') {
    openDialog('Escaleren naar After Travel', `${c.id} · ${esc(c.categorie)}`, `
      <p class="muted">After Travel krijgt de klacht met de volledige klanthistorie. De klant hoeft het verhaal niet opnieuw te vertellen.</p>
      ${fld('e-reden', 'Reden van escalatie', '<textarea id="e-reden" placeholder="bijv. Klant accepteert 4% niet en vraagt om een kamerwissel"></textarea>', { req: true })}`, 'Escaleren', () => {
      if (!setErr('e-reden', val('e-reden').length < 5 ? 'Geef de reden van de escalatie.' : '')) return false;
      c.status = 'Geëscaleerd (After Travel)'; klachtLog(c, 'Geëscaleerd naar After Travel: ' + val('e-reden')); save(); render(); toast('Doorgezet naar After Travel');
    });
  }
  if (c && act === 'ongegrond') {
    openDialog('Klacht ongegrond verklaren', `${c.id} · ${esc(c.categorie)}`, `
      ${fld('u-reden', 'Onderbouwing', '<textarea id="u-reden" placeholder="bijv. Al opgelost op de bestemming, of accommodatie door klant zelf gekozen"></textarea>', { req: true })}`, 'Ongegrond verklaren', () => {
      if (!setErr('u-reden', val('u-reden').length < 5 ? 'Geef een onderbouwing.' : '')) return false;
      Object.assign(c, { status: 'Ongegrond', toelichting: val('u-reden') }); klachtLog(c, 'Ongegrond verklaard: ' + val('u-reden')); save(); render(); toast('Klacht ongegrond verklaard');
    });
  }
  if (c && act === 'goedkeuren' && c.voorgesteldDoor !== S.currentUser) { Object.assign(c, { status: 'Afgehandeld', goedgekeurdDoor: S.currentUser }); klachtLog(c, `Voorstel ${c.pct}% goedgekeurd. Klacht afgehandeld.`); save(); render(); toast('Goedgekeurd en afgehandeld'); }
  if (c && act === 'afkeuren' && c.voorgesteldDoor !== S.currentUser) { Object.assign(c, { status: 'In behandeling', voorgesteldDoor: null }); klachtLog(c, 'Voorstel teruggestuurd voor aanpassing.'); save(); render(); toast('Voorstel teruggestuurd'); }
});
document.addEventListener('keydown', e => {
  const tr = e.target.closest && e.target.closest('tr.click');
  if (tr && (e.key === 'Enter' || e.key === ' ') && e.target === tr) { e.preventDefault(); location.hash = tr.dataset.href; }
});
document.addEventListener('submit', e => { if (e.target.id === 'compForm') { e.preventDefault(); onCompSubmit(e.target); } });
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'klantQuery' || id === 'levQuery') {
    ui[id] = e.target.value; const pos = e.target.selectionStart; render();
    const n = document.getElementById(id); n.focus(); n.setSelectionRange(pos, pos);
  }
  if (id === 'f-pct') {
    const c = S.klachten.find(x => x.id === view.id), b = S.boekingen.find(x => x.id === c.boekingId);
    const rl = RICHTLIJNEN.find(r => r.cat === c.categorie) || { pct: 0 }, p = parseFloat(e.target.value) || 0;
    document.getElementById('calcBedrag').textContent = eur((b?.reissom || 0) * p / 100);
    document.getElementById('toelReq').hidden = p === rl.pct;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'levStatus') { ui.levStatus = e.target.value; render(); document.getElementById('levStatus').focus(); }
  if (e.target.id === 'user') { S.currentUser = e.target.value; save(); render(); toast('Ingelogd als ' + userName(S.currentUser)); }
});
document.getElementById('reset').addEventListener('click', () => {
  openDialog('Testdata herstellen', 'Alle wijzigingen in dit prototype worden teruggezet naar de oorspronkelijke testdata.', '<p>Dit geldt alleen voor jouw browser. Collega\'s met het prototype open merken er niets van.</p>', 'Testdata herstellen', () => {
    S = seed(); save(); ui = { klantQuery: '', tlFilter: 'Alles', levQuery: '', levStatus: 'Alle', klStatus: 'Open', sort: {} }; go('dashboard'); toast('Testdata hersteld');
  });
});

view = parseHash();
render();
})();
</script>
