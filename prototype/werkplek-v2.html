<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoyageVista Werkplek</title>
<meta name="description" content="Klikbaar eindmodel van de medewerkerssite voor Productontwikkeling & Inkoop en Klantenservice & Support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: medewerkerssite — vaste donkere zijbalk (232px), sticky topbalk met zoeken en rolwissel, werkvlak tot 1360px; detailpagina's = inhoud + zijkolom van 340px. */
/* Stijl volgens de VoyageVista UI-guide v1.0: donkerblauw menu, diepgroene primaire knoppen, crème achtergrond, League Spartan, knoppen/velden 44px, radius 8 (knop) en 12 (kaart). */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface-2:#FBF8F3; --sunk:#EFEAE0; --ink:#071525; --muted:#526A68; --faint:#7d918f; --line:#C7D8D0; --line-2:#E4ECE7;
  --primary:#153B3B; --primary-ink:#FFFFFF; --primary-soft:#E3EEE9; --primary-hover:#0E2A2A; --link:#153B3B;
  --brand:#C96F5D; --brand-soft:#F6E4DF; --brand-ink:#A94D3D; --mint:#8FE0C0;
  --side:#071525; --side-ink:#C2CFD6; --side-hover:#0F2236; --side-active:#153B3B; --side-line:rgba(255,255,255,.08);
  --ok:#166534; --ok-soft:#DCFCE7; --warn:#92400E; --warn-soft:#FEF3C7; --crit:#991B1B; --crit-soft:#FEE2E2; --info:#1D4ED8; --info-soft:#DBEAFE;
  --band:#153B3B; --band-ink:#FFFFFF;
  --backdrop:rgba(7,21,37,.55);
  --shadow-sm:0 1px 2px rgba(7,21,37,.06); --shadow:0 1px 2px rgba(7,21,37,.05),0 8px 24px rgba(7,21,37,.08); --shadow-lg:0 20px 60px rgba(7,21,37,.28);
  --f-body:"League Spartan",Arial,Helvetica,sans-serif;
  --f-head:"League Spartan",Arial,Helvetica,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --rb:8px; --side-w:248px; --top-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1A26; --surface:#102434; --surface-2:#132a3b; --sunk:#0c1f2d; --ink:#EEF3F1; --muted:#A9BDB9; --faint:#7b918e; --line:#23404A; --line-2:#1a3340;
  --primary:#8FE0C0; --primary-ink:#071525; --primary-soft:#173a3a; --primary-hover:#b5ecd6; --link:#8FE0C0;
  --brand:#E39484; --brand-soft:#3a2420; --brand-ink:#F0B0A2;
  --side:#050f1b; --side-ink:#b7c6ce; --side-hover:#0e2132; --side-active:#153B3B;
  --ok:#86efac; --ok-soft:#12301f; --warn:#fcd34d; --warn-soft:#33290b; --crit:#fca5a5; --crit-soft:#3b1717; --info:#93c5fd; --info-soft:#14284a;
  --band:#153B3B; --band-ink:#FFFFFF;
  --backdrop:rgba(0,0,0,.6); --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1A26; --surface:#102434; --surface-2:#132a3b; --sunk:#0c1f2d; --ink:#EEF3F1; --muted:#A9BDB9; --faint:#7b918e; --line:#23404A; --line-2:#1a3340;
  --primary:#8FE0C0; --primary-ink:#071525; --primary-soft:#173a3a; --primary-hover:#b5ecd6; --link:#8FE0C0;
  --brand:#E39484; --brand-soft:#3a2420; --brand-ink:#F0B0A2;
  --side:#050f1b; --side-ink:#b7c6ce; --side-hover:#0e2132; --side-active:#153B3B;
  --ok:#86efac; --ok-soft:#12301f; --warn:#fcd34d; --warn-soft:#33290b; --crit:#fca5a5; --crit-soft:#3b1717; --info:#93c5fd; --info-soft:#14284a;
  --band:#153B3B; --band-ink:#FFFFFF;
  --backdrop:rgba(0,0,0,.6); --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:.84em;white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}
/* shell */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:30}
.brand{min-height:var(--top-h);display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--side-line);flex:none}
.logo{width:34px;height:34px;flex:none;display:block}
.brand b{display:block;color:#fff;font:700 16px/1.1 var(--f-head);letter-spacing:.14em}
.brand small{display:block;font-size:12px;opacity:.7;margin-top:3px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border-radius:7px;color:var(--side-ink);font-weight:500;text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:var(--side-hover);color:#fff}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--mint)}
.nav .nr{font:600 12px/1 var(--f-head);color:var(--mint);min-width:18px;opacity:.85}
.nav a span:nth-of-type(2){flex:1}
.count{font-size:12px;min-width:22px;text-align:center;background:rgba(255,255,255,.1);padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.count.alert{background:#C96F5D;color:#fff}
.side-foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px;font-size:12px}
.side-foot button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;opacity:.8;min-height:32px;font-size:13px}
.side-foot .ico{width:16px;height:16px}
.side-foot button:hover{opacity:1;color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:var(--top-h);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.gsearch{position:relative;flex:1 1 auto;max-width:520px;min-width:0}
.gsearch .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.gsearch input{width:100%;height:44px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.gsearch input:focus{outline:2px solid var(--primary);outline-offset:-1px;background:var(--surface)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto}
.gres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;color:inherit;text-decoration:none}
.gres a:hover{background:var(--primary-soft)}
.gres h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 10px 4px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.rolebox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;background:var(--surface)}
.rolebox select{border:0;background:transparent;font-weight:500;font-size:13px;max-width:260px}
.rolebox select:focus{outline:none}
.rolebox:focus-within{outline:2px solid var(--primary)}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.content{padding:24px 32px 64px;display:flex;flex-direction:column;gap:16px;max-width:1400px;width:100%}
/* page head */
.crumb{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--primary)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead h1{font:700 32px/1.15 var(--f-head);letter-spacing:-.005em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .sub{color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--rb);border:1.5px solid var(--primary);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;color:var(--primary);white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{background:var(--primary-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.warn{background:var(--brand-soft);border-color:var(--brand-ink);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;border-color:var(--line)}
/* cards, grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card > .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 0}
.card > .ch h2{font:700 20px/1.2 var(--f-head)}
.card > .cb{padding:12px 20px 20px;display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.split > div{display:flex;flex-direction:column;gap:16px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--primary);border-radius:var(--r);padding:16px 18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px}
a.kpi:hover{border-color:var(--primary)}
.kpi span{font-size:14px;color:var(--muted);font-weight:500}
.kpi b{font:700 32px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.kpi.warn{border-left-color:#D97706}.kpi.crit{border-left-color:var(--brand)}.kpi.ok{border-left-color:#16A34A}
.kpi small{font-size:11.5px;color:var(--muted)}
/* badges */
.bd{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:6px;padding:3px 9px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.bd.ok{background:var(--ok-soft);color:var(--ok)}.bd.warn{background:var(--warn-soft);color:var(--warn)}.bd.crit{background:var(--crit-soft);color:var(--crit)}.bd.info{background:var(--info-soft);color:var(--info)}.bd.brand{background:var(--brand-soft);color:var(--brand-ink)}
.bd .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
/* notes */
.note{display:flex;gap:10px;align-items:flex-start;border-radius:var(--rb);padding:12px 16px;font-size:15px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--info)}
.note > .ico{color:var(--info)}
.note .ico{margin-top:1px}
.note > div{flex:1;min-width:0}
.note.ok{border-left-color:#16A34A}.note.ok > .ico{color:var(--ok)}.note.warn{border-left-color:#D97706;background:var(--warn-soft)}.note.warn > .ico{color:var(--warn)}.note.crit{border-left-color:var(--crit);background:var(--crit-soft);color:var(--crit)}.note.crit > .ico{color:var(--crit)}.note.brand{border-left-color:var(--brand)}.note.brand > .ico{color:var(--brand-ink)}
.note .btn{margin-left:auto;flex:none}
.open-pt{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px}
/* tables */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:14px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td .t1{font-weight:600;color:var(--primary)}
td .t2{font-size:12px;color:var(--muted)}
.right{text-align:right}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;width:300px;max-width:100%}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px 0 34px}
.filters select{height:44px;border:1px solid var(--line);border-radius:var(--rb);background:var(--surface);padding:0 12px;font-weight:500;font-size:15px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:9px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
/* tabs */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:0 0 10px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
/* lists */
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .lt{flex:1;min-width:0}
.li .lt b{font-weight:500;display:block}
.li .lt small{color:var(--muted);font-size:12px;display:block}
.dotc{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12px}
.dotc.ok{background:var(--ok-soft);color:var(--ok)}.dotc.warn{background:var(--warn-soft);color:var(--warn)}.dotc.crit{background:var(--crit-soft);color:var(--crit)}.dotc.n{background:var(--sunk);color:var(--muted)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.steps div{padding:10px 14px;font-size:13px;font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:center;border-right:1px solid var(--line)}
.steps div:last-child{border-right:0}
.steps .done{color:var(--ink)} .steps .done i{color:var(--ok)}
.steps .cur{background:var(--primary-soft);color:var(--primary);font-weight:700}
.steps i{font-style:normal;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:60px;flex:1}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.barrow{display:flex;align-items:center;gap:10px}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty .ico{width:34px;height:34px;color:var(--faint)}
.empty h3{font-size:16px}
/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > label,.fld > .lbl{font-size:14px;font-weight:600}
.fld .req{color:var(--crit)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;min-height:44px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
.fld input[readonly]{background:var(--surface-2);color:var(--muted)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--crit);border-width:1.5px}
.fld .msg{font-size:13.5px;font-weight:500;color:var(--crit);display:flex;gap:5px;align-items:center}
.fld .help{font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 14px;min-height:40px;cursor:pointer;font-weight:500;font-size:13px;background:var(--surface)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chips label:has(input:focus-visible){outline:2px solid var(--primary)}
.fbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--primary)}
/* modal */
.modal-wrap{position:fixed;inset:0;background:var(--backdrop);z-index:60;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px 0}
.modal header h2{font:700 19px/1.2 var(--f-head)}
.modal .mb{padding:14px 22px 22px;display:flex;flex-direction:column;gap:14px}
.xbtn{all:unset;cursor:pointer;color:var(--muted);display:grid;place-items:center;width:32px;height:32px;border-radius:8px}
.xbtn:hover{background:var(--sunk)}
/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--surface);border-radius:10px;padding:11px 16px;box-shadow:var(--shadow-lg);font-weight:500;display:flex;gap:8px;align-items:center;max-width:420px}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}.modal{animation:min .18s ease-out}.content{animation:fin .18s ease-out}}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@keyframes min{from{transform:translateY(10px) scale(.98);opacity:0}}
@keyframes fin{from{opacity:.5}}
/* catalog */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.pcard .pimg{height:96px;display:flex;justify-content:flex-end;align-items:flex-start;padding:10px;position:relative;overflow:hidden}
.pcard .pimg svg{position:absolute;inset:0;width:100%;height:100%}
.pcard .pimg .bd{position:relative}
.pcard .pb{padding:14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .pb b{font:700 16px/1.2 var(--f-head)}
.pcard .pf{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
/* demo */
.demo{position:fixed;right:20px;bottom:20px;z-index:70;width:360px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.demo header{background:#071525;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.demo header b{flex:1;font:700 14px var(--f-head)}
.demo header .xbtn{color:#cfe0ec}
.demo .db{padding:14px;display:flex;flex-direction:column;gap:10px}
.demo .dstep{font-size:11.5px;font-weight:700;color:var(--brand-ink);letter-spacing:.06em;text-transform:uppercase}
.demo h3{font-size:15px}
.demo p{color:var(--muted);font-size:13px}
.demo .dbar{display:flex;gap:4px}
.demo .dbar i{flex:1;height:4px;border-radius:9px;background:var(--sunk)}
.demo .dbar i.on{background:#C96F5D}
.demo footer{display:flex;gap:8px;justify-content:space-between;padding:0 14px 14px}
.start-demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.start-demo button{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.start-demo button:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.start-demo b{font:700 17px var(--f-head);display:flex;gap:8px;align-items:center}
.hl{outline:3px solid #C96F5D!important;outline-offset:3px;border-radius:8px}
.mark{background:var(--crit-soft);color:var(--crit);font-weight:600;border-radius:3px;padding:0 2px}
.timeline .li .dotc{width:30px;height:30px}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);transform:translateX(-100%);transition:transform .2s}
  .app.nav-open .side{transform:none}
  .menu-btn{display:inline-grid!important}
  .topbar{padding:0 14px}.content{padding:18px 14px 64px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .rolebox select{max-width:140px}
  .gsearch{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:26px}
  .demo{right:10px;bottom:10px;width:calc(100vw - 20px)}
}
.menu-btn{display:none;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* paginakop volgens het wireframe-voorbeeld */
.band{background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.band b{font:700 18px/1.2 var(--f-head);letter-spacing:.08em;text-transform:uppercase}
.band b i{font-style:normal;color:var(--mint)}
.band span{color:#cfe3dc;font-size:15px}
.band .iss{margin-left:auto;font:600 13px var(--f-head);color:var(--mint)}
.eyebrow{color:var(--brand-ink);font:600 15px/1.2 var(--f-head);margin-bottom:4px}
.side .wl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);opacity:.8;padding:16px 12px 6px}
/* uitlegpaneel per pagina */
.func{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.func > header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.func > header h2{font:700 13px/1.2 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.func > header small{color:var(--muted);font:600 13px var(--f-head)}
.func .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.func h3{font:700 12.5px/1.2 var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:6px}
.func ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.func-tog{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;opacity:.8;min-height:28px}
@media (max-width:860px){.func .cols{grid-template-columns:minmax(0,1fr)}.phead h1{font-size:26px}.band .iss{margin-left:0}}
.func-open{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.func-open b{color:var(--ink);font-weight:600}

</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Hoofdmenu">
    <div class="brand"><svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#153B3B"/><path d="M8 11l9 14 9-14" fill="none" stroke="#8FE0C0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 11h9" stroke="#C96F5D" stroke-width="3" stroke-linecap="round"/></svg><div><b>VOYAGEVISTA</b><small id="brandsub"></small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button data-a="demoMenu" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg>Rondleiding en start</button>
      <button data-a="uitleg" type="button" ><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span id="uitleg-lbl">Uitleg per scherm</span></button>
      <button data-a="theme" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Licht / donker</button>
      <button data-a="reset" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Voorbeeldgegevens herstellen</button>
      <span style="opacity:.6" id="sidefoot-afd">Groep 3 · klikbaar eindmodel · DEMO</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" data-a="menu" type="button" aria-label="Menu openen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="gsearch"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gq" type="search" placeholder="Zoeken in de werkplek" aria-label="Zoeken in de werkplek" autocomplete="off"><div class="gres" id="gres" hidden></div></div>
      <div class="top-right">
        <div class="rolebox"><span class="av" id="av"></span><label for="role" hidden>Ingelogd als</label><select id="role">
          <optgroup label="Productontwikkeling &amp; Inkoop"><option value="inkoper">Jeroen Bakker · Inkoper</option><option value="product">Sanne de Vries · Productontwikkelaar</option></optgroup>
          <optgroup label="Klantenservice &amp; Support"><option value="ks">Fatima el Amrani · Klantenservice</option><option value="teamleider">Mark de Groot · Teamleider</option><option value="senior">Ingrid Visser · Senior</option><option value="after">Rob Kuipers · After Travel</option></optgroup>
          <optgroup label="Sales &amp; Marketing"><option value="sales">Lisa Vermeer · Sales</option><option value="marketing">Daan Smit · Marketing</option></optgroup>
        </select></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="demo" id="demo" hidden></div>
<script>
'use strict';
/* ================= basis ================= */
const TODAY = '2026-10-29';
const NOW = new Date('2026-10-29T10:00:00');
const MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd = iso => { if (!iso) return '—'; const d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso); return d.getDate() + ' ' + MND[d.getMonth()] + (d.getFullYear() !== 2026 ? ' ' + d.getFullYear() : ''); };
const fdl = iso => { if (!iso) return '—'; const d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso); return d.getDate() + ' ' + MND[d.getMonth()] + ' ' + d.getFullYear(); };
const ft = iso => { const d = new Date(iso); return fd(iso) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const days = (a, b = TODAY) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);
const eur = n => '€ ' + Number(n).toLocaleString('nl-NL', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const nowIso = () => { const d = new Date(NOW.getTime() + (S.clock || 0) * 60000); return d.toISOString().slice(0, 16); };
const uid = (p, list) => { let n = 1; for (const x of list) { const m = String(x.id).match(/(\d+)$/); if (m) n = Math.max(n, +m[1] + 1); } return p + String(n).padStart(4, '0'); };

/* iconen (eenvoudige lijnen) */
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/>', bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1 2.2h5.2c0-.9.4-1.7 1-2.2A6 6 0 0 0 12 3z"/>',
  box:'<path d="m3 7 9-4 9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4M12 11v10"/>', cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  bld:'<path d="M4 21V5l8-2v18M12 9h8v12"/><path d="M8 8v.01M8 12v.01M8 16v.01M16 13v.01M16 17v.01"/>', chat:'<path d="M4 5h16v11H8l-4 4z"/>',
  file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>', grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/>',
  inbox:'<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/>', brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18"/>',
  alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.01"/>', coins:'<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v5c0 1.7 2.7 3 6 3s6-1.3 6-3V7M9 15v3c0 1.7 2.7 3 6 3s6-1.3 6-3v-5c0-1.6-2.4-2.9-5.5-3"/>',
  chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>', shield:'<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>', check:'<path d="m5 12 5 5 9-10"/>',
  bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>', moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', play:'<path d="M7 4v16l13-8z"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/>', up:'<path d="m6 15 6-6 6 6"/>', down:'<path d="m6 9 6 6 6-6"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', star:'<path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/>', menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', send:'<path d="M3 11 21 3l-8 18-2-8z"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', route:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const ic = (n, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;

/* ================= rollen ================= */
const ROLES = {
  inkoper:  { naam:'Jeroen Bakker', fn:'Inkoper', ini:'JB', kleur:'#153B3B', afd:'ink' },
  product:  { naam:'Sanne de Vries', fn:'Productontwikkelaar', ini:'SV', kleur:'#2F5D5A', afd:'ink' },
  ks:       { naam:'Fatima el Amrani', fn:'Klantenservice', ini:'FA', kleur:'#153B3B', afd:'ks' },
  teamleider:{ naam:'Mark de Groot', fn:'Teamleider klantenservice', ini:'MG', kleur:'#071525', afd:'ks' },
  senior:   { naam:'Ingrid Visser', fn:'Senior klantenservice', ini:'IV', kleur:'#A94D3D', afd:'ks' },
  after:    { naam:'Rob Kuipers', fn:'After Travel', ini:'RK', kleur:'#526A68', afd:'ks' },
  sales:    { naam:'Lisa Vermeer', fn:'Sales & Boekingen', ini:'LV', kleur:'#A94D3D', afd:'cat' },
  marketing:{ naam:'Daan Smit', fn:'Marketing', ini:'DS', kleur:'#2F5D5A', afd:'cat' },
};
const me = () => ROLES[S.role];
const myName = () => me().naam;
const isRole = (...r) => r.includes(S.role);

/* ================= opslag ================= */
let S;
const KEY = 'vv-werkplek-2';
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.v === 4) return v; } catch (e) {} return null; }
function resetData(role) { S = seed(); if (role) S.role = role; save(); }

/* ================= ui-toestand (niet opgeslagen) ================= */
const U = { q: {}, err: {}, modal: null, toasts: [], gq: '', focus: null, open: [] };
function toast(t, kind = 'ok') { const id = Math.random(); U.toasts.push({ id, t, kind }); U.toasts = U.toasts.slice(-3); drawToasts(); setTimeout(() => { U.toasts = U.toasts.filter(x => x.id !== id); drawToasts(); }, 3600); }
function drawToasts() { const el = document.getElementById('toasts'); if (el) el.innerHTML = U.toasts.map(x => `<div class="toast" role="status">${ic(x.kind === 'ok' ? 'check' : 'info', 'sm')}<span>${esc(x.t)}</span></div>`).join(''); }
function logH(obj, tekst) { (obj.historie ||= []).unshift({ t: nowIso(), door: myName(), tekst }); }

/* ================= componenten ================= */
const bd = (t, k = '') => `<span class="bd ${k}">${esc(t)}</span>`;
const note = (t, k = 'info', btn = '') => `<div class="note ${k === 'info' ? '' : k}" role="${k === 'crit' ? 'alert' : 'note'}">${ic(k === 'ok' ? 'check' : k === 'crit' || k === 'warn' || k === 'brand' ? 'alert' : 'info')}<div>${t}</div>${btn}</div>`;
const openPt = t => { U.open.push(t); return ''; };
const btn = (label, a, o = {}) => `<button type="${o.type || 'button'}" class="btn ${o.k || ''} ${o.sm ? 'sm' : ''}" ${a ? `data-a="${a}"` : ''} ${o.d ? `data-d='${esc(JSON.stringify(o.d))}'` : ''} ${o.dis ? 'disabled' : ''} ${o.id ? `id="${o.id}"` : ''} ${o.title ? `title="${esc(o.title)}"` : ''}>${o.ic ? ic(o.ic, 'sm') : ''}${esc(label)}</button>`;
const lnk = (label, href, k = '', icn = '') => `<a class="btn ${k}" href="#${href}">${icn ? ic(icn, 'sm') : ''}${esc(label)}</a>`;
const card = (title, body, right = '') => `<section class="card">${title ? `<div class="ch"><h2>${esc(title)}</h2>${right}</div>` : ''}<div class="cb">${body}</div></section>`;
const kv = pairs => `<dl class="kv">${pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;
const li = (title, sub, right = '', lead = '') => `<div class="li">${lead}<div class="lt"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>${right}</div>`;
const dotc = (t, k = '') => `<span class="dotc ${k}">${t}</span>`;
const barH = (pct, col) => `<span class="bar"><i style="width:${Math.max(2, Math.min(100, pct))}%;${col ? 'background:' + col : ''}"></i></span>`;
const empty = (t1, t2, acts = '', icn = 'search') => `<div class="empty">${ic(icn)}<h3>${esc(t1)}</h3><p class="muted">${esc(t2)}</p><div class="acts" style="justify-content:center;margin-top:6px">${acts}</div></div>`;
const kpis = items => `<div class="kpis">${items.map(([l, v, k, href, sub]) => `${href ? `<a class="kpi ${k || ''}" href="#${href}">` : `<div class="kpi ${k || ''}">`}<span>${esc(l)}</span><b>${v}</b>${sub ? `<small>${esc(sub)}</small>` : ''}${href ? '</a>' : '</div>'}`).join('')}</div>`;
function head(crumbs, title, sub = '', acts = '', tags = '') {
  const m = MOD[U.act] || [], items = NAV[me().afd][0][1], i = items.findIndex(x => x[0] === U.act);
  const band = i >= 0 ? `<div class="band"><b><i>${String(i).padStart(2, '0')}</i> / ${esc(items[i][1])}</b>${m[0] ? `<span>${esc(m[0])}</span>` : ''}</div>` : '';
  return band + `<div class="crumb"><a href="#${homeOf()}">Werkplek</a><span>/</span><span>${esc(AFD[me().afd])}</span><span>/</span>${crumbs.map(([t, h]) => h ? `<a href="#${h}">${esc(t)}</a>` : `<span>${esc(t)}</span>`).join('<span>/</span>')}</div>
  <div class="phead"><div>${m[1] ? `<p class="eyebrow">${esc(m[1])}</p>` : ''}<h1>${esc(title)}${tags}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
}
/* verwijzingen naar use cases en interviews horen in de documentatie, niet in het scherm */
const clean = h => h.replace(/\s*\((?:UC|interview|P\d|#\d)[^)]*\)/g, '').replace(/<div><\/div>/g, '');
function funcPanel() {
  const f = FUNC[U.act]; if (!f || !U.uitleg) return '';
  const m = MOD[U.act] || [];
  return `<section class="func" aria-label="Functionaliteit op deze pagina"><header><h2>Functionaliteit op deze pagina</h2><small>${m[2] ? esc(m[2]) + ' · ' : ''}ontwerp en verwacht gedrag</small></header><div class="cols"><div><h3>Acties van de medewerker</h3><ul>${f[0].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Controles en systeemreacties</h3><ul>${f[1].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>${U.open.length ? `<p class="func-open"><b>Nog af te stemmen:</b> ${U.open.map(esc).join(' · ')}</p>` : ''}</section>`;
}
const tabs = (base, items, act) => `<nav class="tabs" aria-label="Tabbladen">${items.map(([k, t]) => `<a href="#${base}.${k}" ${k === act ? 'aria-current="page"' : ''}>${esc(t)}</a>`).join('')}</nav>`;
const steps = (items, cur) => `<div class="steps" aria-label="Status">${items.map((t, i) => `<div class="${i < cur ? 'done' : i === cur ? 'cur' : ''}"><i>${i < cur ? '✓' : i + 1}</i>${esc(t)}</div>`).join('')}</div>`;
function table(cols, rows, o = {}) {
  if (!rows.length) return `<div class="tbl">${o.empty || empty('Niets gevonden', 'Pas de zoekterm of filters aan.')}</div>`;
  return `<div class="tbl"><table><thead><tr>${cols.map(c => `<th class="${c.r ? 'right' : ''}">${esc(c.t ?? c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr ${r.href ? `class="click" data-href="${r.href}"` : ''}>${r.c.map((v, i) => `<td class="${cols[i].r ? 'right num' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const t12 = (a, b) => `<div class="t1">${a}</div>${b ? `<div class="t2">${b}</div>` : ''}`;
function search(key, ph) { return `<label class="search">${ic('search', 'sm')}<span class="sr-only" hidden>Zoeken</span><input id="q-${key}" data-q="${key}" value="${esc(U.q[key] || '')}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></label>`; }
