<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoyageVista · Wireframes Productontwikkeling &amp; Inkoop</title>
<meta name="description" content="Klikbaar prototype van de 71 nieuwe wireframes Productontwikkeling &amp; Inkoop (PK, RP, RD, LV, AB, ON, CT, PL, CA, DA, AU).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--side:#274638;--side2:#365747;--sideTxt:#E3ECE4;--bg:#F6F7F2;--card:#FFFFFF;--line:#DFE8DF;--ink:#22352A;--muted:#5B6F61;--accent:#63786A;--pill:#E8EEE8;--field:#F6F8F4;--ro:#E6ECE5;--focus:#2F6B4A;--err:#B4232F;--errBg:#FDECEE;--warn:#8A5A00;--warnBg:#FFF5DE;--ok:#1E6B3D;--okBg:#E5F3EA;--rad:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Poppins,system-ui,sans-serif}
h1,h2,h3{font-family:Urbanist,Poppins,sans-serif;margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:50}.skip:focus{left:8px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sideTxt);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:14px 18px;border-bottom:1px solid #ffffff20;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.sidebar-logo{width:205px;max-width:100%;padding:7px 9px;border-radius:9px;background:#f4f1eb;display:block}
.brand small{width:205px;text-align:center;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#c2d2c4}
.nav h4{margin:18px 10px 6px;font:500 10px Poppins;letter-spacing:.12em;text-transform:uppercase;color:#bbcfbf}
.side h4{margin:22px 22px 8px;font:600 11px Poppins;letter-spacing:.08em;opacity:.8}
.nav a{display:flex;gap:10px;margin:2px 12px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--sideTxt);font-size:14px}
.nav a b{font-weight:500;opacity:.75;min-width:20px}
.nav a:hover{background:var(--side2)}
.nav a[aria-current=page]{background:#426650;box-shadow:inset 3px 0 0 #9fbba7;font-weight:600}
.side .foot{margin-top:auto;padding:14px 22px;border-top:1px solid #ffffff20;font-size:12px;font-weight:600}
.side .tools a{display:block;margin:2px 12px;padding:7px 12px;border-radius:9px;color:var(--sideTxt);font-size:13px;text-decoration:none;border:1px dashed #5d7a68}
.side .tools a:hover{background:var(--side2)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;background:#fff;border-bottom:1px solid var(--line);padding:12px 28px;position:sticky;top:0;z-index:5}
.crumb{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.gsearch{width:min(320px,40vw);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.avatar{background:var(--pill);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px}
.view{padding:28px;max-width:1240px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.head h1{font-size:30px;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted)}
.pill{display:inline-block;background:var(--pill);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600;color:#3D5546;white-space:nowrap}
.pill.err{background:var(--errBg);color:var(--err)}.pill.warn{background:var(--warnBg);color:var(--warn)}.pill.ok{background:var(--okBg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 18px;text-align:left;cursor:default}
a.kpi,button.kpi{cursor:pointer;text-decoration:none;position:relative}a.kpi:hover{border-color:var(--accent)}a.kpi::after{content:"Bekijken →";position:absolute;right:16px;bottom:14px;font-size:12px;color:var(--focus);font-weight:600}
.kpi span{color:var(--muted);font-size:13px}.kpi strong{display:block;font:700 26px Urbanist}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:20px 22px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;padding:10px 12px}
.toolbar input{flex:1;min-width:120px;border:0;background:transparent;padding:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 18px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--side);border-color:var(--side);color:#fff}.btn.pri:hover{background:#1f3428}
.btn.sm{padding:6px 14px;min-height:34px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.actions .btn{min-width:180px;justify-content:flex-start}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{background:#EEF2EC;text-align:left;font-size:12px;font-weight:600;color:#3D5546;padding:10px 14px}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:12px 14px;font-size:13px}
td:first-child{font-weight:600}
tbody tr:nth-child(even) td{background:#F6F8F4}
tbody tr.link{cursor:pointer}tbody tr.link:hover td{background:#EAF0E9}
tbody tr.sel td{background:#E1EBE3!important}
.tablewrap{overflow-x:auto}
.help{color:var(--muted);font-size:12px;margin:10px 4px 0}
.filters{display:none;gap:10px;align-items:center;margin:-6px 0 14px;padding:10px 14px}
.filters.open{display:flex}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.det div{border-bottom:1px solid var(--line);padding:12px 0 14px}
.det dt{font-size:12px;color:var(--muted);font-weight:600}.det dd{margin:4px 0 0;font-size:15px}
.det dd a{color:var(--focus);font-weight:500}
.sec{font:600 12px Poppins;letter-spacing:.05em;color:#3D5546;text-transform:uppercase;margin:0 0 12px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 26px 6px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl a{color:var(--focus)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}
.f label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 12px}
.f textarea{min-height:44px;resize:vertical}
.f input[readonly]{background:var(--ro);color:var(--muted)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--err);background:#fff8f8}
.f .msg{color:var(--err);font-size:12px;margin-top:4px}
.note-req{grid-column:1/-1;color:var(--muted);font-size:12px}
.alert{border-radius:10px;padding:12px 16px;margin:0 0 16px;font-size:13px;border:1px solid}
.alert.err{background:var(--errBg);border-color:#f3c3c8;color:#7d1720}
.alert.warn{background:var(--warnBg);border-color:#efd9a6;color:#5e3e00}
.alert.ok{background:var(--okBg);border-color:#bfe0cb;color:#174f2e}
.alert .btn{margin-top:8px}
.rhead{display:flex;justify-content:space-between;align-items:center;background:#EEF2EC;border-radius:10px;padding:14px 18px;margin-bottom:18px}
.rhead h2{font-size:18px;font-weight:700}
.checks label{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:14px}
.checks input{width:20px;height:20px;accent-color:var(--side)}
.reason textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:10px 12px}
.state{max-width:640px;margin:40px auto}
.state h2{font-size:22px;margin:14px 0 12px}.state p{margin:0 0 8px;color:#3a4a3f}
.state.err{border-color:#f0c6cb}.state.warn{border-color:#efd9a6}.state.ok{border-color:#bfe0cb}
.demo{margin-top:16px;border:1.5px dashed #9fb3a5;border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fbfcfa}
.demo span{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.docs{margin-top:26px;background:#F7F9F5;border:1px solid var(--line);border-radius:var(--rad);padding:16px 20px}
.docs summary{cursor:pointer;font:700 15px Urbanist;letter-spacing:.04em}
.docs p{margin:8px 0 0;font-size:13px}.docs .erd{color:#3D5546;font-weight:600}.docs .nv{color:var(--muted)}
.docs .out{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}.docs .out a{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;text-decoration:none}
.wfmark{color:var(--muted);font-size:11px;letter-spacing:.06em;margin-top:18px}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700}.no{color:#9aa59d}
.toast{position:fixed;right:20px;bottom:20px;background:var(--side);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:60;max-width:360px}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,24,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal{background:#fff;border-radius:14px;padding:22px 24px;max-width:440px;width:100%}
.modal h2{font-size:20px;margin-bottom:8px}
.flows{display:grid;gap:18px}
.flow h3{font-size:17px;margin-bottom:4px}
.flow ol{margin:8px 0 0;padding-left:20px}.flow li{margin:4px 0}
.flow li a{color:var(--focus);font-weight:600}
.story{background:#EEF2EC;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.idx ul{list-style:none;padding:0;margin:6px 0 0}.idx li{padding:3px 0;font-size:13px}
.idx li a{color:var(--focus);font-weight:600;text-decoration:none}.idx li a:hover{text-decoration:underline}
.tag{font-size:11px;color:var(--muted);margin-left:6px}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(-100%);transition:transform .2s;z-index:40}
 .side.open{transform:none}
 .menu-btn{display:inline-block}
 .view{padding:18px 16px}
 .top{padding:10px 16px}
 .gsearch{display:none}
 .kpis,.grid2,.form,.det{grid-template-columns:1fr}
 .head h1{font-size:24px}
 .actions .btn{min-width:0;flex:1 1 100%}
}
@media print{.side,.top,.demo,.actions,.docs{display:none}.app{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 3200); }
function modal(title, text, okLabel, onOk){
 const bg = document.createElement('div'); bg.className='modal-bg';
 bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn pri" data-ok>${esc(okLabel)}</button><button class="btn" data-no>Blijven</button></div></div>`;
 const prev = document.activeElement; document.body.appendChild(bg);
 const close = () => { bg.remove(); prev && prev.focus(); };
 bg.querySelector('[data-ok]').onclick = () => { close(); onOk(); };
 bg.querySelector('[data-no]').onclick = close;
 bg.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
 bg.querySelector('[data-ok]').focus();
}
function go(target){
 if (target === 'back') { history.length > 1 ? history.back() : (location.hash = '#/DA01'); return; }
 if (target === '#print') { window.print(); return; }
 if (target === '#addrule') { toast('Extra annuleringsregel toegevoegd (voorbeeld).'); return; }
 location.hash = '#/' + target;
}
function leave(target){
 if (dirty) modal('Wijzigingen niet opgeslagen','Je hebt gegevens ingevuld die nog niet zijn opgeslagen. Wil je dit scherm toch verlaten?','Verlaten zonder opslaan',()=>{ dirty=false; go(target); });
 else go(target);
}

/* ---------- renderers ---------- */
function btnHtml(b){
 const [label, target, pri, kind] = b;
 return `<button type="button" class="btn${pri?' pri':''}" data-go="${esc(target)}" data-kind="${esc(kind||'')}">${esc(label)}</button>`;

/* ---------- behaviour ---------- */
function validate(d){
 const errs = []; const form = $('#frm');
 form.querySelectorAll('.f').forEach(f => {
  f.classList.remove('bad'); const el = f.querySelector('input,select,textarea'); const m = f.querySelector('.msg'); m.textContent=''; el.removeAttribute('aria-invalid');
  const v = (el.value||'').trim(); let msg = '';
  if (f.dataset.req && !v) msg = 'Dit veld is verplicht.';
  else if (f.dataset.kind === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'Dit is geen geldig e-mailadres.';
  else if (f.dataset.kind === 'num' && v && Number(v) < 0) msg = 'Voer een positief getal in.';
  if (msg) { f.classList.add('bad'); m.textContent = msg; el.setAttribute('aria-invalid','true'); el.setAttribute('aria-describedby', m.id); errs.push(f.dataset.label); }
 });
 if (d.dateCheck && !errs.length) {
  const [a,b] = d.dateCheck.map(l => [...form.querySelectorAll('.f')].find(f => f.dataset.label === l.replace(/\*$/,'')));
  const va = a.querySelector('input').value, vb = b.querySelector('input').value;
  if (va && vb && vb <= va) { b.classList.add('bad'); b.querySelector('.msg').textContent = 'De einddatum moet na de begindatum liggen.'; errs.push(b.dataset.label); }
 }
 const box = $('#ferr');
 if (errs.length) { box.hidden=false; box.innerHTML = `<b>Opslaan is niet gelukt.</b> Controleer de gemarkeerde velden: ${errs.map(esc).join(', ')}.`; box.focus(); return false; }
 box.hidden = true; return true;
}
function dupCheck(){
 const get = l => ([...document.querySelectorAll('.f')].find(f=>f.dataset.label===l)?.querySelector('input,select')?.value||'').trim().toLowerCase();
 const w = $('#fwarn');
 if (get('Naam') === 'sakura hotels' && get('Plaats') === 'tokio' && w.hidden) {
  w.hidden=false; w.innerHTML='<b>Mogelijk dubbele leverancier.</b> Er bestaat al een leverancier “Sakura Hotels” in Tokio. Controleer eerst of dit geen dubbele leverancier is. Klik nogmaals op Registreren als het echt een nieuwe leverancier is.';
  w.scrollIntoView({block:'center'}); return false; }
 return true;
}
function act(d, b){
 const target = b.dataset.go, kind = b.dataset.kind;
 if (d.t === 'compare' && /Selecteren|Onderhandeling/.test(b.textContent) && !document.querySelector('input[name=pick]:checked')) { $('#pickerr').hidden=false; return; }
 if (kind === 'cancel') { leave(target); return; }
 if (kind === 'save') {
  if (!validate(d)) return;
  if (d.dup && !dupCheck()) return;
  if (d.id === 'ON06') ST.onActionsDone = true;
  dirty = false; pendingToast = d.id === 'CA05' ? null : 'Opgeslagen.'; go(target); return; }
 if (kind === 'approve' || kind === 'reason' || kind === 'close') {
  const box = $('#ferr'); box.hidden = true; $('#reasonm').textContent='';
  if (kind === 'close' && d.openActions && !ST.onActionsDone) { box.hidden=false; box.innerHTML='<b>Afsluiten kan niet:</b> er staat nog 1 vervolgactie open. Rond eerst alle vervolgacties af.<br><a class="btn sm" href="#/ON06">Vervolgactie afronden → ON06</a>'; box.focus(); return; }
  if (kind === 'approve' && [...document.querySelectorAll('.checks input')].some(c=>!c.checked)) { box.hidden=false; box.textContent='Vink eerst alle controlepunten aan voordat je goedkeurt.'; box.focus(); return; }
  if (kind === 'reason' && !$('#reason').value.trim()) { $('#reasonm').textContent='Een reden is verplicht bij '+b.textContent.trim().toLowerCase()+'.'; $('#reason').setAttribute('aria-invalid','true'); $('#reason').focus(); return; }
  pendingToast = {approve:'Besluit vastgelegd: goedgekeurd.',close:'Onderhandeling afgesloten met akkoord. Contractformulier geopend.'}[kind] || `Vastgelegd: ${b.textContent.trim()}.`;
  dirty = false; go(target); return; }
 if (kind === 'publish') { pendingToast = 'Rondreis Japan is gepubliceerd en zichtbaar in de catalogus.'; go(target); return; }
 leave(target);
}
function wire(d){
 const v = $('#view');
 v.querySelectorAll('[data-go]').forEach(el => {
  if (el.tagName === 'TR') {
   el.addEventListener('click', () => leave(el.dataset.go));
   el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); leave(el.dataset.go); } });
  } else el.addEventListener('click', () => d ? act(d, el) : go(el.dataset.go));
 });
 if (!d) return;
 const frm = $('#frm'); if (frm) { frm.addEventListener('input', ()=>{ dirty = true; }); frm.addEventListener('submit', e=>e.preventDefault()); }
 const q = $('#q'), fs = $('#fsel');
 const filt = () => { let n=0; const t=(q?.value||'').toLowerCase(), s=fs?.value||'';
  v.querySelectorAll('#tb tr').forEach(tr => { const show = tr.textContent.toLowerCase().includes(t) && (!s || [...tr.children].some(td=>td.textContent.trim()===s)); tr.hidden=!show; n+=show; });
  $('#none').hidden = n>0; };
 q && q.addEventListener('input', filt); fs && fs.addEventListener('change', filt);
 const fb = $('#fbtn'); fb && fb.addEventListener('click', () => { const r=$('#frow'); if(!r){toast('Geen filters beschikbaar voor deze lijst.');return;} r.classList.toggle('open'); fb.setAttribute('aria-expanded', r.classList.contains('open')); });
 const ex = $('#exp'); ex && ex.addEventListener('click', () => {
  const csv = [d.cols, ...d.rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download = d.id+'-'+d.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv'; a.click(); toast('Export gedownload (CSV).'); });
 v.querySelectorAll('input[name=pick]').forEach(r => r.addEventListener('change', () => { $('#pickerr').hidden=true; v.querySelectorAll('#tb tr').forEach(tr=>tr.classList.toggle('sel', tr.dataset.i===r.value)); }));
 const dc = $('#docs'); dc && dc.addEventListener('toggle', () => { try { localStorage.setItem('wfDocs', dc.open?'1':'0'); } catch(e){} });
}

 document.title = (d?d.id+' · ':'') + title + ' · VoyageVista Wireframes';
 $('#nav').querySelectorAll('a').forEach(a => a.dataset.m === m ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
 const mm = MODS.find(x=>x[0]===m); $('#crumb').innerHTML = `<a href="#/DA01">Werkplek</a>` + (mm ? ` / ${esc(mm[4])} / <a href="#/${mm[3]}">${esc(mm[2])}</a>` : '') + ` / ${esc(title)}`;
 wire(d);
 $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');
 window.scrollTo(0,0); v.focus({preventScroll:true});
 if (pendingToast) { toast(pendingToast); pendingToast = null; }
}

$('#nav').innerHTML = [...new Set(MODS.map(m=>m[4]))].map(g => `<h4>${esc(g)}</h4>` + MODS.filter(m=>m[4]===g).map(m => `<a href="#/${m[3]}" data-m="${m[0]}">${esc(m[2])}</a>`).join('')).join('');
$('#screenlist').innerHTML = ORDER.map(i => `<option value="${i} ${esc(SCREENS[i].title)}">`).join('');
$('#gsearch').addEventListener('keydown', e => { if (e.key !== 'Enter') return; const t = e.target.value.trim().toLowerCase(); if (!t) return;
 const hit = ORDER.find(i => i.toLowerCase() === t.slice(0,4)) || ORDER.find(i => (i+' '+SCREENS[i].title).toLowerCase().includes(t));
 if (hit) { e.target.value=''; go(hit); } else toast('Geen scherm gevonden voor “'+e.target.value+'”.'); });
$('#menuBtn').addEventListener('click', () => { const s=$('#side'); s.classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', s.classList.contains('open')); });
window.addEventListener('hashchange', render);
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue=''; } });
render();
</script>
